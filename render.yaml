databases:
  - name: traceback-ai-db
    databaseName: traceback_ai_db
    user: traceback_ai_db_user
    plan: free
    region: singapore

services:
  - type: web
    name: traceback-ai
    runtime: node
    plan: free
    region: singapore
    branch: feat/provider-neutral-agent-engine
    rootDir: agent-native-poc
    buildCommand: corepack enable && corepack prepare pnpm@10.29.1 --activate && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    healthCheckPath: /demo
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: DATABASE_URL
        fromDatabase:
          name: traceback-ai-db
          property: connectionString
      - key: BETTER_AUTH_SECRET
        generateValue: true
